name: Prove RK3588 real task-state migration v9

on:
  push:
    branches:
      - rk3588-v9-real-state
    paths:
      - 'experiments/rk3588-state-v9/**'
      - '.github/workflows/stage-rk3588-state-migration-v9.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Decode, patch V9 liveness races, and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          D=experiments/rk3588-state-v9
          base64 -d "$D/source.tar.gz.b64" > /tmp/v9-source.tar.gz
          echo 'e8ab0f1f0f016cf5b636705c8167449ff2da90f6913ae425fef9c55629aa7cd3  /tmp/v9-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v9-source.tar.gz -C "$D"
          cat <<'EOF' | sha256sum -c -
          2164de2cd03ba391017068f685dea24ba42c7426fe2d1ab6c71a1fb3746d8d84  experiments/rk3588-state-v9/rkmesh_v9.c
          b265c49f2e8f6e5082beb78239059306e20ff885cc1d43577e2e8b91dfac5a1b  experiments/rk3588-state-v9/init.c
          eb1105f57945b8726cd312772e5d83e81c452d7df96de72535e220d41793fcdf  experiments/rk3588-state-v9/run-one-v9.sh
          7a6ce85ed202670198286de813d1a4dd0612051fb8477138cdcad0b533cf07a3  experiments/rk3588-state-v9/run-v9-matrix.py
          ad6a873583a099f990f5590e1bd91a64bca09dcb0e9549922c2f67e35b929c0a  experiments/rk3588-state-v9/verify-v9.py
          c7aa2afe1bcbaed5e33dd11aa498553cb47f2417e5fda1f053c68f79bc6a0844  experiments/rk3588-state-v9/ivshmem_server.py
          34052174b58fa5b8963b9a1db02128c0bc21f2427b7ae70745670a63c8d5d2ad  experiments/rk3588-state-v9/Makefile
          f6e96579ced1b2afa8ca1d58717ecb207fc3958a112cbbfac872e2b414e57679  experiments/rk3588-state-v9/EXPECTED_STATE_CHECKSUMS.txt
          EOF
          python3 - <<'PY'
          from pathlib import Path

          p=Path('experiments/rk3588-state-v9/init.c')
          s=p.read_text()
          old='state_xfer_delta,expect_page,expect_state;config=config_for(mode,iter);'
          new='state_xfer_delta,expect_page,expect_state;migrated=0;config=config_for(mode,iter);'
          if old not in s:
              raise SystemExit('V9 migrated-init patch anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('experiments/rk3588-state-v9/verify-v9.py')
          s=p.read_text()
          old=""" for i,t in enumerate(tasks):\n  assert hx(t,'page_checksum')=='0x4a9f55cc4def6f8d';assert hx(t,'exec_checksum')==exe[i];assert hx(t,'state_after')==state[i+1]\n"""
          new=""" seen=set()\n for t in tasks:\n  i=val(t,'iter')\n  assert 0 <= i < e['iterations'] and i not in seen,(name,i,t)\n  seen.add(i)\n  assert hx(t,'page_checksum')=='0x4a9f55cc4def6f8d';assert hx(t,'exec_checksum')==exe[i]\n assert seen==set(range(e['iterations'])),(name,seen)\n"""
          if old not in s:
              raise SystemExit('V9 verifier-order patch anchor missing')
          p.write_text(s.replace(old,new,1))

          p=Path('experiments/rk3588-state-v9/rkmesh_v9.c')
          s=p.read_text()
          replacements=[
            ('#define STATE_LOCAL_HITS_BASE 0x248\n#define SLOT_BASE        0x300', '#define STATE_LOCAL_HITS_BASE 0x248\n#define BARRIER_BASE     0x260\n#define SLOT_BASE        0x300'),
            ('#define RK_STATE_COMMIT  _IOW(RK_IOC_MAGIC,24,struct rk_state_op)', '#define RK_STATE_COMMIT  _IOW(RK_IOC_MAGIC,24,struct rk_state_op)\n#define RK_BARRIER       _IOW(RK_IOC_MAGIC,25,__u32)'),
            ('case RK_WAIT_STEP:if(copy_from_user(&v,(void __user*)arg,sizeof(v)))return -EFAULT;for(i=0;i<10000;i++){if(readl(d->bar2+STEP_OFF)>=v)return 0;msleep(1);}return -ETIMEDOUT;', 'case RK_BARRIER:if(copy_from_user(&v,(void __user*)arg,sizeof(v)))return -EFAULT;writel(v,d->bar2+BARRIER_BASE+d->id*4);wmb();for(i=0;i<10000;i++){u32 n;for(n=0;n<NODES;n++)if(readl(d->bar2+BARRIER_BASE+n*4)<v)break;if(n==NODES)return 0;msleep(1);}pr_err("RKMESH_V9_BARRIER_TIMEOUT id=%u phase=%u a0=%u a1=%u a2=%u a3=%u\\n",d->id,v,readl(d->bar2+BARRIER_BASE),readl(d->bar2+BARRIER_BASE+4),readl(d->bar2+BARRIER_BASE+8),readl(d->bar2+BARRIER_BASE+12));return -ETIMEDOUT;\n    case RK_WAIT_STEP:if(copy_from_user(&v,(void __user*)arg,sizeof(v)))return -EFAULT;for(i=0;i<10000;i++){if(readl(d->bar2+STEP_OFF)>=v)return 0;msleep(1);}return -ETIMEDOUT;'),
            ('for(i=0;i<NODES;i++){writel(0,d->bar2+LOCAL_HITS_BASE+i*4);writel(0,d->bar2+STATE_LOCAL_HITS_BASE+i*4);}', 'for(i=0;i<NODES;i++){writel(0,d->bar2+LOCAL_HITS_BASE+i*4);writel(0,d->bar2+STATE_LOCAL_HITS_BASE+i*4);writel(0,d->bar2+BARRIER_BASE+i*4);}')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('V9 kernel barrier patch anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('experiments/rk3588-state-v9/init.c')
          s=p.read_text()
          replacements=[
            ('#define RK_STATE_COMMIT _IOW(RK_IOC_MAGIC,24,struct rk_state_op)', '#define RK_STATE_COMMIT _IOW(RK_IOC_MAGIC,24,struct rk_state_op)\n#define RK_BARRIER _IOW(RK_IOC_MAGIC,25,uint32_t)'),
            ('static void wait_step(uint32_t s){if(ioctl(fd,RK_WAIT_STEP,&s))die("wait step");}static void set_step(uint32_t s){if(ioctl(fd,RK_SET_STEP,&s))die("set step");}static void get_status(struct rk_status*s){if(ioctl(fd,RK_GET_STATUS,s))die("status");}', 'static void barrier(uint32_t phase){if(ioctl(fd,RK_BARRIER,&phase))die("barrier");}static void get_status(struct rk_status*s){if(ioctl(fd,RK_GET_STATUS,s))die("status");}'),
            ('static void perform_mutation(unsigned config,int prev,unsigned iter){static const unsigned p1[1]={1};static const unsigned p59[2]={5,9};if(prev<0){if(my_id==0){mutate_pages(p1,1,config,iter);set_step(100+iter*10+1);}return;}if((unsigned)prev==config){if(my_id==0)set_step(100+iter*10+1);return;}if(config==1&&my_id==3){mutate_pages(p59,2,config,iter);set_step(100+iter*10+1);}if(config==0&&my_id==1){mutate_pages(p59,2,config,iter);set_step(100+iter*10+1);}}', 'static void perform_mutation(unsigned config,int prev,unsigned iter){static const unsigned p1[1]={1};static const unsigned p59[2]={5,9};if(prev<0){if(my_id==0)mutate_pages(p1,1,config,iter);return;}if((unsigned)prev==config)return;if(config==1&&my_id==3)mutate_pages(p59,2,config,iter);if(config==0&&my_id==1)mutate_pages(p59,2,config,iter);}'),
            ('for(iter=0;iter<iters;iter++){uint32_t start=100+iter*10;uint64_t mut_delta,page_delta,state_delta;uint32_t hit_delta,state_hit_delta,state_xfer_delta,expect_page,expect_state;migrated=0;config=config_for(mode,iter);if(my_id==0){get_status(&before_mut);if(before_mut.state_owner!=current||before_mut.state_gen!=iter||before_mut.state_checksum!=expected_state[iter])_exit(100);set_step(start);}else wait_step(start);perform_mutation(config,prev,iter);wait_step(start+1);', 'for(iter=0;iter<iters;iter++){uint32_t start=100+iter*10;uint64_t mut_delta,page_delta,state_delta;uint32_t hit_delta,state_hit_delta,state_xfer_delta,expect_page,expect_state;migrated=0;config=config_for(mode,iter);barrier(start);if(my_id==0){get_status(&before_mut);if(before_mut.state_owner!=current||before_mut.state_gen!=iter||before_mut.state_checksum!=expected_state[iter])_exit(100);}perform_mutation(config,prev,iter);barrier(start+1);'),
            ('target=current;if(ioctl(fd,RK_SET_TARGET,&target))die("set target");printf("RKMESH_V9_DECISION mode=%s iter=%u config=%c current_before=%u best=%u current_after=%u c0=%u c1=%u c2=%u c3=%u advantage=%u credit=%u migrated=%u migrations=%u mutation_bytes=%llu\\n",mode_name(mode),iter,config?\'B\':\'A\',current_before,best,current,costs[0],costs[1],costs[2],costs[3],advantage,credit,migrated,migrations,(unsigned long long)mut_delta);set_step(start+2);\n  }else wait_step(start+2);get_status(&after_mut);target=after_mut.task_target?after_mut.task_target-1:99;if(target>=4)_exit(102);if(my_id==target){run_task(mode,iter,target);set_step(start+3);}wait_step(start+3);', 'target=current;if(ioctl(fd,RK_SET_TARGET,&target))die("set target");printf("RKMESH_V9_DECISION mode=%s iter=%u config=%c current_before=%u best=%u current_after=%u c0=%u c1=%u c2=%u c3=%u advantage=%u credit=%u migrated=%u migrations=%u mutation_bytes=%llu\\n",mode_name(mode),iter,config?\'B\':\'A\',current_before,best,current,costs[0],costs[1],costs[2],costs[3],advantage,credit,migrated,migrations,(unsigned long long)mut_delta);\n  }barrier(start+2);if(my_id!=0)get_status(&after_mut);target=my_id==0?current:(after_mut.task_target?after_mut.task_target-1:99);if(target>=4)_exit(102);if(my_id==target){printf("RKMESH_V9_TASK_BEGIN id=%u iter=%u target=%u state_owner=%u state_gen=%u state_checksum=0x%016llx\\n",my_id,iter,target,after_mut.state_owner,after_mut.state_gen,(unsigned long long)after_mut.state_checksum);run_task(mode,iter,target);}barrier(start+3);'),
            ('expect_page=remote_cost(&after_mut,current);expect_state=migrated?TASK_STATE_BYTES:0;if(page_delta!=expect_page||state_delta!=expect_state||state_xfer_delta!=(migrated?1u:0u)||state_hit_delta!=(migrated?0u:1u)||after_task.state_owner!=current||after_task.state_gen!=iter+1||after_task.state_checksum!=expected_state[iter+1])_exit(103);', 'expect_page=remote_cost(&after_mut,current);expect_state=migrated?TASK_STATE_BYTES:0;printf("RKMESH_V9_ACCOUNT_CHECK mode=%s iter=%u page_actual=%llu page_expected=%u state_actual=%llu state_expected=%u xfers_actual=%u xfers_expected=%u state_hits_actual=%u state_hits_expected=%u owner_actual=%u owner_expected=%u gen_actual=%u gen_expected=%u checksum_actual=0x%016llx checksum_expected=0x%016llx\\n",mode_name(mode),iter,(unsigned long long)page_delta,expect_page,(unsigned long long)state_delta,expect_state,state_xfer_delta,migrated?1u:0u,state_hit_delta,migrated?0u:1u,after_task.state_owner,current,after_task.state_gen,iter+1,(unsigned long long)after_task.state_checksum,(unsigned long long)expected_state[iter+1]);if(page_delta!=expect_page||state_delta!=expect_state||state_xfer_delta!=(migrated?1u:0u)||state_hit_delta!=(migrated?0u:1u)||after_task.state_owner!=current||after_task.state_gen!=iter+1||after_task.state_checksum!=expected_state[iter+1])_exit(103);')
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('V9 userspace liveness patch anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          echo '3cebe5338a5f549a0475495a2a42c1390e93b4fd550c39045ace4d24fc073633  experiments/rk3588-state-v9/rkmesh_v9.c' | sha256sum -c -
          echo 'f26d9b1361321b4ac7477ebe64adb8f2ddc0f7c130bcdb4e8f7e6cdceb5ee62e  experiments/rk3588-state-v9/init.c' | sha256sum -c -
          echo '00305cf22bb51170a16cec9683c05562dfe18fbbadd3b757c09b922ac1f8b2bb  experiments/rk3588-state-v9/verify-v9.py' | sha256sum -c -
          gcc -O2 -Wall -Wextra -Werror -fsyntax-only "$D/init.c"
          python3 -m py_compile "$D/ivshmem_server.py" "$D/run-v9-matrix.py" "$D/verify-v9.py"
          bash -n "$D/run-one-v9.sh"

      - name: Cross-build ARM64 guest and portable runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" debian:trixie bash -lc '
            set -euo pipefail
            dpkg --add-architecture arm64
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
              cpio ca-certificates xz-utils make file
            cd /tmp
            kp=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-[0-9]/{print \$2;exit}")
            test -n "$kp"
            kb=${kp%%:*}
            ver=${kb#linux-image-}
            apt-get download "$kp"
            kdeb=$(find /tmp -maxdepth 1 -name "${kb}_*_arm64.deb" | head -1)
            test -n "$kdeb"
            dpkg-deb -x "$kdeb" /tmp/kernel
            hp="linux-headers-${ver}:arm64"
            apt-get download "$hp"
            hb=${hp%%:*}
            hdeb=$(find /tmp -maxdepth 1 -name "${hb}_*_arm64.deb" | head -1)
            test -n "$hdeb"
            common="linux-headers-${ver%-arm64}-common"
            kbuild="linux-kbuild-${ver%-arm64}"
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"
            dpkg-deb -x "$hdeb" /
            hdr="/usr/src/linux-headers-${ver}"
            test -d "$hdr"
            make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/experiments/rk3588-state-v9 modules
            aarch64-linux-gnu-gcc -O2 -static -s -Wall -Wextra -Werror /work/experiments/rk3588-state-v9/init.c -o /work/out/init
            mkdir -p /work/out/runtime/bin /work/out/runtime/lib /work/out/runtime/lib64
            cp /usr/bin/qemu-system-aarch64 /work/out/runtime/bin/
            ldd /usr/bin/qemu-system-aarch64 | awk "{for(i=1;i<=NF;i++)if(\$i~/^\//)print \$i}" | sort -u >/tmp/libs
            while read -r lib; do mkdir -p "/work/out/runtime$(dirname "$lib")"; cp -L "$lib" "/work/out/runtime$lib"; done </tmp/libs
            loader=$(ldd /usr/bin/qemu-system-aarch64 | awk "/ld-linux/{for(i=1;i<=NF;i++)if(\$i~/^\//){print \$i;exit}}")
            test -n "$loader"
            mkdir -p "/work/out/runtime$(dirname "$loader")"
            cp -L "$loader" "/work/out/runtime$loader"
            mkdir -p /work/out/guest/root/{proc,sys,dev}
            kernel=$(find /tmp/kernel/boot -maxdepth 1 -name "vmlinuz-*" | head -1)
            test -n "$kernel"
            cp "$kernel" /work/out/guest/Image
            cp /work/out/init /work/out/guest/root/init
            cp /work/experiments/rk3588-state-v9/rkmesh_v9.ko /work/out/guest/root/rkmesh_v9.ko
            cd /work/out/guest/root
            find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /work/out/guest/initramfs.cpio.gz
            /work/out/runtime/lib64/ld-linux-x86-64.so.2 --library-path /work/out/runtime/lib/x86_64-linux-gnu:/work/out/runtime/usr/lib/x86_64-linux-gnu /work/out/runtime/bin/qemu-system-aarch64 --version > /work/out/QEMU_VERSION.txt
            printf "%s\n" "$ver" > /work/out/KERNEL_VERSION.txt
          '
          D=experiments/rk3588-state-v9
          cp "$D/ivshmem_server.py" out/
          cp "$D/run-one-v9.sh" out/
          cp "$D/run-v9-matrix.py" out/
          cp "$D/verify-v9.py" out/
          cp "$D/EXPECTED_STATE_CHECKSUMS.txt" out/
          cp "$D/rkmesh_v9.c" out/rkmesh_v9-source.c
          cp "$D/init.c" out/init-source.c
          chmod +x out/ivshmem_server.py out/run-one-v9.sh out/run-v9-matrix.py out/verify-v9.py

      - name: Gate pos_hyst liveness across 20 fresh four-guest boots, then run full matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/reliability
          mkdir -p out/reliability
          for i in $(seq -w 1 20); do
            root="$PWD/out/reliability/run-$i"
            RUN_ROOT="$root" ./out/run-one-v9.sh 2
            summary="$root/pos_hyst/summary.txt"
            grep -q 'mode=pos_hyst iterations=7 migrations=1 final_host=1 task_page_bytes=73728 state_transfer_bytes=8192 state_xfers=1 measured_total=81920 mutation_control_bytes=12288' "$summary"
            grep -q 'final_state_gen=7 final_state_checksum=0xa1d675e2b67b913c' "$summary"
            test "$(wc -l < "$root/pos_hyst/tasks.txt")" -eq 7
            test "$(wc -l < "$root/pos_hyst/state-transfers.txt")" -eq 1
            echo "RKMESH_V9_POS_HYST_RELIABILITY_PASS run=$i"
          done | tee out/POS_HYST_RELIABILITY.txt
          test "$(grep -c '^RKMESH_V9_POS_HYST_RELIABILITY_PASS ' out/POS_HYST_RELIABILITY.txt)" -eq 20
          ./out/run-v9-matrix.py
          ./out/verify-v9.py | tee out/V9_VERIFY.txt
          find out/reliability out/results -type f -name iv.bin -delete
          find out/reliability out/results -type s -delete || true
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Package passing V9 runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf rk3588-state-migration-v9.tar.gz .
          sha256sum rk3588-state-migration-v9.tar.gz | tee rk3588-state-migration-v9.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-state-migration-v9
          path: |
            rk3588-state-migration-v9.tar.gz
            rk3588-state-migration-v9.tar.gz.sha256
            out/QEMU_VERSION.txt
            out/KERNEL_VERSION.txt
            out/SHA256SUMS
            out/POS_HYST_RELIABILITY.txt
            out/V9_RESULT.json
            out/V9_VERIFY.txt
            out/reliability/**
            out/results/**
            experiments/rk3588-state-v9/rkmesh_v9.c
            experiments/rk3588-state-v9/init.c
            experiments/rk3588-state-v9/run-one-v9.sh
            experiments/rk3588-state-v9/run-v9-matrix.py
            experiments/rk3588-state-v9/verify-v9.py
            experiments/rk3588-state-v9/ivshmem_server.py
            experiments/rk3588-state-v9/Makefile
            experiments/rk3588-state-v9/EXPECTED_STATE_CHECKSUMS.txt
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
