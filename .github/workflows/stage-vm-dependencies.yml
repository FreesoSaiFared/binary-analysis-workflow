name: Stage bounded VM dependency capsules

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-vm-dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact missing wheel
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip download --only-binary=:all: --no-deps --dest out tomli-w==1.2.0
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vm-python-tomli-w-1.2.0
          path: out/
          retention-days: 1
          compression-level: 0

  go-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: true
      - name: Package exact Go toolchain
        run: |
          set -euo pipefail
          mkdir -p out
          goroot=$(go env GOROOT)
          go version | tee out/GO_VERSION.txt
          tar -C "$(dirname "$goroot")" -czf out/go1.26.5-linux-amd64.tar.gz "$(basename "$goroot")"
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vm-go-1.26.5-linux-amd64
          path: out/
          retention-days: 1
          compression-level: 0

  agent-cloud-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Retrieve pinned source through gh-proxy and build with isolated Maven repository
        env:
          REPOSITORY: yangpeng366/agent-cloud-harness
          COMMIT: b8c7cae6388e03e68910d4259377ce74f346831f
        run: |
          set -euo pipefail
          mkdir -p work out
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1200 \
            --output work/source.tar.gz \
            "https://gh-proxy.com/https://github.com/${REPOSITORY}/archive/${COMMIT}.tar.gz"
          tar -tzf work/source.tar.gz >/dev/null
          tar -xzf work/source.tar.gz -C work
          src=$(find work -mindepth 1 -maxdepth 1 -type d -name 'agent-cloud-harness-*' -print -quit)
          repo="$PWD/work/m2repo"
          cd "$src"
          mvn -B -Dmaven.repo.local="$repo" dependency:go-offline
          mvn -B -Dmaven.repo.local="$repo" test package
          cp target/*-all.jar "$OLDPWD/out/" 2>/dev/null || cp target/*.jar "$OLDPWD/out/"
          cd "$OLDPWD"
          maven_home=$(mvn -version | awk -F': ' '/Maven home/{print $2; exit}')
          mvn -version > out/MAVEN_VERSION.txt
          java -version > out/JAVA_VERSION.txt 2>&1
          tar -C "$(dirname "$maven_home")" -czf out/maven-home.tar.gz "$(basename "$maven_home")"
          tar -C work -czf out/agent-cloud-m2repo.tar.gz m2repo
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vm-agent-cloud-maven-offline
          path: out/
          retention-days: 1
          compression-level: 0
