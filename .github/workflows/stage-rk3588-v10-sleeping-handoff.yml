name: Prove RK3588 sleeping execution-state handoff v10

on:
  push:
    branches:
      - rk3588-v10-sleeping-handoff
    paths:
      - 'experiments/rk3588-v10-handoff/**'
      - '.github/workflows/stage-rk3588-v10-sleeping-handoff.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Admit V10 source and report hashes
        shell: bash
        run: |
          set -euo pipefail
          D=experiments/rk3588-v10-handoff
          sha256sum "$D"/rkmesh_v10.c "$D"/init.c "$D"/run-one-v10.sh "$D"/ivshmem_server.py "$D"/Makefile | tee /tmp/V10_SOURCE_SHA256.txt
          gcc -O2 -Wall -Wextra -Werror -fsyntax-only "$D/init.c"
          bash -n "$D/run-one-v10.sh"
          python3 -m py_compile "$D/ivshmem_server.py"
      - name: Cross-build ARM64 guest and portable runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          cp /tmp/V10_SOURCE_SHA256.txt out/
          docker run --rm --privileged -v "$PWD:/work" debian:trixie bash -lc '
            set -euo pipefail
            dpkg --add-architecture arm64
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross cpio ca-certificates xz-utils make file
            cd /tmp
            kp=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-[0-9]/{print \$2;exit}")
            test -n "$kp"; kb=${kp%%:*}; ver=${kb#linux-image-}
            apt-get download "$kp"; kdeb=$(find /tmp -maxdepth 1 -name "${kb}_*_arm64.deb" | head -1); test -n "$kdeb"; dpkg-deb -x "$kdeb" /tmp/kernel
            hp="linux-headers-${ver}:arm64"; apt-get download "$hp"; hb=${hp%%:*}; hdeb=$(find /tmp -maxdepth 1 -name "${hb}_*_arm64.deb" | head -1); test -n "$hdeb"
            common="linux-headers-${ver%-arm64}-common"; kbuild="linux-kbuild-${ver%-arm64}"; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"; dpkg-deb -x "$hdeb" /
            hdr="/usr/src/linux-headers-${ver}"; test -d "$hdr"
            make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/experiments/rk3588-v10-handoff modules
            aarch64-linux-gnu-gcc -O2 -static -s -Wall -Wextra -Werror /work/experiments/rk3588-v10-handoff/init.c -o /work/out/init
            mkdir -p /work/out/runtime/bin /work/out/runtime/lib /work/out/runtime/lib64
            cp /usr/bin/qemu-system-aarch64 /work/out/runtime/bin/
            ldd /usr/bin/qemu-system-aarch64 | awk "{for(i=1;i<=NF;i++)if(\$i~/^\//)print \$i}" | sort -u >/tmp/libs
            while read -r lib; do mkdir -p "/work/out/runtime$(dirname "$lib")"; cp -L "$lib" "/work/out/runtime$lib"; done </tmp/libs
            loader=$(ldd /usr/bin/qemu-system-aarch64 | awk "/ld-linux/{for(i=1;i<=NF;i++)if(\$i~/^\//){print \$i;exit}}")
            test -n "$loader"; mkdir -p "/work/out/runtime$(dirname "$loader")"; cp -L "$loader" "/work/out/runtime$loader"
            mkdir -p /work/out/guest/root/{proc,sys,dev}; kernel=$(find /tmp/kernel/boot -maxdepth 1 -name "vmlinuz-*" | head -1); test -n "$kernel"; cp "$kernel" /work/out/guest/Image
            cp /work/out/init /work/out/guest/root/init; cp /work/experiments/rk3588-v10-handoff/rkmesh_v10.ko /work/out/guest/root/rkmesh_v10.ko
            cd /work/out/guest/root; find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /work/out/guest/initramfs.cpio.gz
            /work/out/runtime/lib64/ld-linux-x86-64.so.2 --library-path /work/out/runtime/lib/x86_64-linux-gnu:/work/out/runtime/usr/lib/x86_64-linux-gnu /work/out/runtime/bin/qemu-system-aarch64 --version > /work/out/QEMU_VERSION.txt
            printf "%s\n" "$ver" > /work/out/KERNEL_VERSION.txt
          '
          cp experiments/rk3588-v10-handoff/ivshmem_server.py out/
          cp experiments/rk3588-v10-handoff/run-one-v10.sh out/
          cp experiments/rk3588-v10-handoff/rkmesh_v10.c out/rkmesh_v10-source.c
          cp experiments/rk3588-v10-handoff/init.c out/init-source.c
          chmod +x out/ivshmem_server.py out/run-one-v10.sh
      - name: Execute both V10 discriminators
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT="$PWD/out/results" ./out/run-one-v10.sh 0
          RUN_ROOT="$PWD/out/results" ./out/run-one-v10.sh 1
          grep -q 'RKMESH_QEMU_4ARM64_V10_CASE_PASS mode=migrate_sleep' out/results/migrate_sleep/summary.txt
          grep -q 'RKMESH_QEMU_4ARM64_V10_CASE_PASS mode=stay_local' out/results/stay_local/summary.txt
          echo RKMESH_QEMU_4ARM64_SLEEPING_HANDOFF_V10_PASS | tee out/V10_VERIFY.txt
          find out/results -type f -name iv.bin -delete
          find out/results -type s -delete || true
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Package V10 runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf rk3588-sleeping-handoff-v10.tar.gz .
          sha256sum rk3588-sleeping-handoff-v10.tar.gz | tee rk3588-sleeping-handoff-v10.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-sleeping-handoff-v10
          path: |
            rk3588-sleeping-handoff-v10.tar.gz
            rk3588-sleeping-handoff-v10.tar.gz.sha256
            out/**
            experiments/rk3588-v10-handoff/**
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
