name: Stage pinned Codex 0.147.0 Linux runtime
on:
  push:
    paths:
      - .github/workflows/stage-codex-0147-linux.yml
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - name: Discover, download and verify official Codex release asset
        shell: bash
        run: |
          set -euo pipefail
          tag='rust-v0.147.0'
          mkdir -p out extracted
          release_json=$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/openai/codex/releases/tags/${tag}")
          jq -r '.assets[] | [.name, .size, .digest, .browser_download_url] | @tsv' <<<"$release_json" > out/RELEASE_ASSETS.tsv

          mapfile -t candidates < <(jq -r '.assets[].name' <<<"$release_json" | grep -E '^codex.*x86_64.*linux.*\.tar\.gz$' | grep -v -E '\.sigstore$' || true)
          if ((${#candidates[@]} == 0)); then
            echo 'No x86_64 Linux Codex tarball found. Available Codex assets:' >&2
            jq -r '.assets[].name' <<<"$release_json" | grep -i codex >&2 || true
            exit 20
          fi
          asset_name=''
          for n in "${candidates[@]}"; do
            if [[ "$n" == *gnu* ]]; then asset_name="$n"; break; fi
          done
          if [[ -z "$asset_name" ]]; then asset_name="${candidates[0]}"; fi

          asset=$(jq -c --arg n "$asset_name" '.assets[] | select(.name==$n)' <<<"$release_json")
          url=$(jq -r '.browser_download_url' <<<"$asset")
          digest=$(jq -r '.digest' <<<"$asset")
          size=$(jq -r '.size' <<<"$asset")
          test -n "$url" && test "$url" != null
          test -n "$digest" && test "$digest" != null
          curl -fL --retry 4 --retry-delay 2 -o "out/$asset_name" "$url"
          got=$(sha256sum "out/$asset_name" | awk '{print $1}')
          test "sha256:$got" = "$digest"
          test "$(stat -c %s "out/$asset_name")" = "$size"
          tar -tzf "out/$asset_name" > out/TAR_LIST.txt
          tar -xzf "out/$asset_name" -C extracted
          bin=$(find extracted -type f -perm -111 -printf '%p\n' | grep -E '/codex([^/]*)$' | head -1)
          test -n "$bin"
          "$bin" --version > out/CODEX_VERSION.txt
          cp "$bin" out/codex
          chmod +x out/codex

          api_tag=$(curl -fsSL -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/openai/codex/git/ref/tags/${tag}")
          object_type=$(jq -r '.object.type' <<<"$api_tag")
          object_sha=$(jq -r '.object.sha' <<<"$api_tag")
          printf 'repository=openai/codex\nrelease_tag=%s\nrelease_id=%s\npublished_at=%s\nasset=%s\nasset_size=%s\nasset_digest=%s\ntag_object_type=%s\ntag_object_sha=%s\n' \
            "$tag" "$(jq -r '.id' <<<"$release_json")" "$(jq -r '.published_at' <<<"$release_json")" "$asset_name" "$size" "$digest" "$object_type" "$object_sha" > out/IDENTITY.txt
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS
          cat out/IDENTITY.txt
          cat out/CODEX_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codex-0.147.0-x86_64-linux
          path: out/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
