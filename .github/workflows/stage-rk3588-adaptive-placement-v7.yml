name: Prove RK3588 adaptive cost-aware placement v7

on:
  push:
    branches:
      - rk3588-v7-adaptive-placement
    paths:
      - 'experiments/rk3588-adaptive-v7/**'
      - '.github/workflows/stage-rk3588-adaptive-placement-v7.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact V7 source
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/rk3588-adaptive-v7
          cat <<'EOF' | sha256sum -c -
          7bf92b4b9fc61cb7c2be2c29a8b7d019e710351f4f2729e3b767edcb9a77249c  rkmesh_v7.c
          59519ef29e4424857c6d98a76409474ebe19cf086db320d2a6b30f9a791b2015  init.c
          954746c7116132793c24297de7907341c4a671d1d3cba883f21af8a3d7f3c6a1  run-one-v7.sh
          4951c5d8be7213af2d53cc9c924468b4ae653f01a1b2eef09cc3c0761e2016dd  run-v7-matrix.py
          8bd7728b99f5daee27358457ab67e405157a88bde0066ecb90591a54504dd2b9  verify-v7.py
          c7aa2afe1bcbaed5e33dd11aa498553cb47f2417e5fda1f053c68f79bc6a0844  ivshmem_server.py
          acb3d6d3e5a898915c9b2e2996ba3abe31e0346aed1f40e06d450aa53ee17c55  Makefile
          ad3ad9c74dede27b8df735217571c385eff36420f8420de9286a6006f568ee38  EXPECTED_TASK_CHECKSUM.txt
          EOF
          gcc -O2 -Wall -Wextra -Werror -fsyntax-only init.c
          python3 -m py_compile ivshmem_server.py run-v7-matrix.py verify-v7.py
          bash -n run-one-v7.sh

      - name: Cross-build ARM64 guest and portable runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" debian:trixie bash -lc '
            set -euo pipefail
            dpkg --add-architecture arm64
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
              cpio ca-certificates xz-utils make file
            cd /tmp
            kp=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-[0-9]/{print \$2;exit}")
            test -n "$kp"; kb=${kp%%:*}; ver=${kb#linux-image-}; apt-get download "$kp"
            kdeb=$(find /tmp -maxdepth 1 -name "${kb}_*_arm64.deb" | head -1); test -n "$kdeb"; dpkg-deb -x "$kdeb" /tmp/kernel
            hp="linux-headers-${ver}:arm64"; apt-get download "$hp"; hb=${hp%%:*}; hdeb=$(find /tmp -maxdepth 1 -name "${hb}_*_arm64.deb" | head -1); test -n "$hdeb"
            common="linux-headers-${ver%-arm64}-common"; kbuild="linux-kbuild-${ver%-arm64}"
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"
            dpkg-deb -x "$hdeb" /
            hdr="/usr/src/linux-headers-${ver}"; test -d "$hdr"
            make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/experiments/rk3588-adaptive-v7 modules
            aarch64-linux-gnu-gcc -O2 -static -s -Wall -Wextra -Werror /work/experiments/rk3588-adaptive-v7/init.c -o /work/out/init
            mkdir -p /work/out/runtime/bin /work/out/runtime/lib /work/out/runtime/lib64
            cp /usr/bin/qemu-system-aarch64 /work/out/runtime/bin/
            ldd /usr/bin/qemu-system-aarch64 | awk "{for(i=1;i<=NF;i++)if(\$i~/^\//)print \$i}" | sort -u >/tmp/libs
            while read -r lib; do mkdir -p "/work/out/runtime$(dirname "$lib")"; cp -L "$lib" "/work/out/runtime$lib"; done </tmp/libs
            loader=$(ldd /usr/bin/qemu-system-aarch64 | awk "/ld-linux/{for(i=1;i<=NF;i++)if(\$i~/^\//){print \$i;exit}}")
            test -n "$loader"; mkdir -p "/work/out/runtime$(dirname "$loader")"; cp -L "$loader" "/work/out/runtime$loader"
            mkdir -p /work/out/guest/root/{proc,sys,dev}
            kernel=$(find /tmp/kernel/boot -maxdepth 1 -name "vmlinuz-*" | head -1); test -n "$kernel"; cp "$kernel" /work/out/guest/Image
            cp /work/out/init /work/out/guest/root/init
            cp /work/experiments/rk3588-adaptive-v7/rkmesh_v7.ko /work/out/guest/root/rkmesh_v7.ko
            cd /work/out/guest/root
            find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /work/out/guest/initramfs.cpio.gz
            /work/out/runtime/lib64/ld-linux-x86-64.so.2 --library-path /work/out/runtime/lib/x86_64-linux-gnu:/work/out/runtime/usr/lib/x86_64-linux-gnu /work/out/runtime/bin/qemu-system-aarch64 --version > /work/out/QEMU_VERSION.txt
            printf "%s\n" "$ver" > /work/out/KERNEL_VERSION.txt
          '
          cp experiments/rk3588-adaptive-v7/ivshmem_server.py out/
          cp experiments/rk3588-adaptive-v7/run-one-v7.sh out/
          cp experiments/rk3588-adaptive-v7/run-v7-matrix.py out/
          cp experiments/rk3588-adaptive-v7/verify-v7.py out/
          cp experiments/rk3588-adaptive-v7/EXPECTED_TASK_CHECKSUM.txt out/
          cp experiments/rk3588-adaptive-v7/rkmesh_v7.c out/rkmesh_v7-source.c
          cp experiments/rk3588-adaptive-v7/init.c out/init-source.c
          chmod +x out/ivshmem_server.py out/run-one-v7.sh out/run-v7-matrix.py out/verify-v7.py
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Run ten fresh four-guest placement experiments
        shell: bash
        run: |
          set -euo pipefail
          ./out/run-v7-matrix.py 0 10
          ./out/verify-v7.py | tee out/V7_VERIFY.txt

      - name: Package passing V7 runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C out -czf rk3588-adaptive-placement-v7.tar.gz .
          sha256sum rk3588-adaptive-placement-v7.tar.gz | tee rk3588-adaptive-placement-v7.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-adaptive-placement-v7
          path: |
            rk3588-adaptive-placement-v7.tar.gz
            rk3588-adaptive-placement-v7.tar.gz.sha256
            out/QEMU_VERSION.txt
            out/KERNEL_VERSION.txt
            out/SHA256SUMS
            out/V7_RESULT.json
            out/V7_VERIFY.txt
            out/results/**
            experiments/rk3588-adaptive-v7/**
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
