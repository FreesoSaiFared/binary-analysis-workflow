name: Clean-room RV1126 RKNN F2 on Ubuntu 20.04

on:
  push:
    branches:
      - rv1126-generative-video-f0-f1
    paths:
      - '.github/workflows/stage-rv1126-f2-legacy-rknn-ubuntu2004.yml'
      - 'experiments/rv1126-generative-video-fabric/build_f2_onnx.py'
      - 'experiments/rv1126-generative-video-fabric/run_f2_legacy_conversion.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu2004-cleanroom:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Bootstrap Ubuntu 20.04 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git build-essential python3 python3-dev python3-pip
          python3 --version
          python3 -m pip --version

      - uses: actions/checkout@v4

      - name: Install exact Rockchip legacy environment
        shell: bash
        run: |
          set -euxo pipefail
          D=experiments/rv1126-generative-video-fabric
          O="$RUNNER_TEMP/f2-u20"
          mkdir -p "$O/models" "$O/results"
          cd "$O"
          cat /etc/os-release | tee results/os-release.txt
          python3 --version 2>&1 | tee results/python-version.txt
          curl -fL --retry 3 -o packages.zip \
            https://github.com/rockchip-linux/rknn-toolkit/releases/download/v1.7.5/rknn-toolkit-v1.7.5-packages.zip
          echo 'f5de735b9b733d74f97db5cce46c2c70  packages.zip' | md5sum -c -
          unzip -q packages.zip -d packages
          WHEEL=$(find packages -name 'rknn_toolkit-1.7.5-cp38-cp38-linux_x86_64.whl' -print -quit)
          test -n "$WHEEL"
          python3 -m pip install --upgrade 'pip<24' wheel 'setuptools<76'
          python3 -m pip install "$WHEEL"
          python3 -m pip install 'tensorflow==2.2.0' 'torch==1.10.0' 'mxnet==1.5.0'
          python3 -m pip install --no-deps 'torchvision==0.11.0'
          python3 -m pip check | tee results/pip-check.txt || true
          python3 - <<'PY' | tee results/environment.txt
          from importlib.metadata import version
          import tensorflow as tf, torch, torchvision, mxnet
          from rknn.api import RKNN
          for p in ('tensorflow','torch','torchvision','mxnet','rknn-toolkit','onnx','numpy'):
              print('METADATA',p,version(p))
          print('RUNTIME tensorflow',tf.__version__)
          print('RUNTIME torch',torch.__version__)
          print('RUNTIME torchvision',torchvision.__version__)
          print('RUNTIME mxnet',mxnet.__version__)
          r=RKNN(verbose=True); r.release()
          print('UBUNTU2004_RKNN_1_7_5_CONSTRUCTOR_PASS')
          PY
          cd "$GITHUB_WORKSPACE"
          python3 "$D/build_f2_onnx.py" --out "$O/models"

      - name: Convert positive and negative controls for original RV1126
        shell: bash
        run: |
          set -euxo pipefail
          D=experiments/rv1126-generative-video-fabric
          O="$RUNNER_TEMP/f2-u20"
          python3 "$D/run_f2_legacy_conversion.py" --models "$O/models" --out "$O/results" \
            2>&1 | tee "$O/results/converter.log"
          python3 - <<'PY' "$O"
          import hashlib,json,pathlib,sys
          o=pathlib.Path(sys.argv[1]); rs=json.load(open(o/'results/F2_CONVERSION_RESULTS.json'))
          by={r['model']:r for r in rs}
          def ok(n):
              r=by[n]; return r['load_ret']==0 and r['build_ret']==0 and r['export_ret']==0 and not r['exception']
          assert ok('rv1126_f2_positive.onnx'), by['rv1126_f2_positive.onnx']
          assert not ok('rv1126_f2_resize.onnx'), by['rv1126_f2_resize.onnx']
          assert not ok('rv1126_f2_warp.onnx'), by['rv1126_f2_warp.onnx']
          p=o/'results/rv1126_f2_positive.rknn'; assert p.exists() and p.stat().st_size>0
          print('UBUNTU2004_F2_OPERATOR_GATE_PASS')
          print('RKNN_SIZE',p.stat().st_size)
          print('RKNN_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          sha256sum "$O"/models/*.onnx "$O"/results/* | tee "$O/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv1126-f2-ubuntu2004-cleanroom
          path: |
            ${{ runner.temp }}/f2-u20/models/**
            ${{ runner.temp }}/f2-u20/results/**
            ${{ runner.temp }}/f2-u20/SHA256SUMS
          if-no-files-found: warn
