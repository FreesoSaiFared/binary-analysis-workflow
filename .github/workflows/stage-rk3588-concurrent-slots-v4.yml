name: Prove RK3588 concurrent transaction slots v4

on:
  push:
    paths:
      - 'experiments/rk3588-concurrent-v4/**'
      - '.github/workflows/stage-rk3588-concurrent-slots-v4.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify v4 source
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/rk3588-concurrent-v4
          cat <<'EOF' | sha256sum -c -
          5a53582e7ef1eac1e74dc8cbd8f8568c7e0f3352ac1c5bb2d2ec81a73b41b858  Makefile
          f71cdc5465c8f8ecb30415f013515cf5bdb6091e4bfb99444b0e4f188211997c  init.c
          c7aa2afe1bcbaed5e33dd11aa498553cb47f2417e5fda1f053c68f79bc6a0844  ivshmem_server.py
          23c0d048a13447adeb422e5e010b3de7baf5d25fa580c240b8cf252219fd55ab  rkmesh_concurrent.c
          f487aa329c3dc0ce8ba4980f3afc94c75a9a6bebd9e5cbbb09805555dcb2e5ae  run-four-v4.sh
          EOF
          gcc -fsyntax-only -Wall -Wextra -Werror -pthread init.c
          python3 -m py_compile ivshmem_server.py
          bash -n run-four-v4.sh

      - name: Cross-build ARM64 guest, module, and portable QEMU runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" debian:trixie bash -lc '
            set -euo pipefail
            dpkg --add-architecture arm64
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
              cpio ca-certificates xz-utils make file
            cd /tmp
            kp=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-[0-9]/{print \$2;exit}")
            test -n "$kp"; kb=${kp%%:*}; ver=${kb#linux-image-}; apt-get download "$kp"
            kdeb=$(find /tmp -maxdepth 1 -name "${kb}_*_arm64.deb" | head -1); test -n "$kdeb"; dpkg-deb -x "$kdeb" /tmp/kernel
            hp="linux-headers-${ver}:arm64"; apt-get download "$hp"; hb=${hp%%:*}; hdeb=$(find /tmp -maxdepth 1 -name "${hb}_*_arm64.deb" | head -1); test -n "$hdeb"
            common="linux-headers-${ver%-arm64}-common"; kbuild="linux-kbuild-${ver%-arm64}"
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"
            dpkg-deb -x "$hdeb" /
            hdr="/usr/src/linux-headers-${ver}"; test -d "$hdr"
            make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/experiments/rk3588-concurrent-v4 modules
            aarch64-linux-gnu-gcc -O2 -static -s -Wall -Wextra -Werror -pthread /work/experiments/rk3588-concurrent-v4/init.c -o /work/out/init
            mkdir -p /work/out/runtime/bin /work/out/runtime/lib /work/out/runtime/lib64
            cp /usr/bin/qemu-system-aarch64 /work/out/runtime/bin/
            ldd /usr/bin/qemu-system-aarch64 | awk "{for(i=1;i<=NF;i++)if(\$i~/^\//)print \$i}" | sort -u >/tmp/libs
            while read -r lib; do mkdir -p "/work/out/runtime$(dirname "$lib")"; cp -L "$lib" "/work/out/runtime$lib"; done </tmp/libs
            loader=$(ldd /usr/bin/qemu-system-aarch64 | awk "/ld-linux/{for(i=1;i<=NF;i++)if(\$i~/^\//){print \$i;exit}}")
            test -n "$loader"; mkdir -p "/work/out/runtime$(dirname "$loader")"; cp -L "$loader" "/work/out/runtime$loader"
            mkdir -p /work/out/guest/root/{proc,sys,dev}
            kernel=$(find /tmp/kernel/boot -maxdepth 1 -name "vmlinuz-*" | head -1); test -n "$kernel"; cp "$kernel" /work/out/guest/Image
            cp /work/out/init /work/out/guest/root/init
            cp /work/experiments/rk3588-concurrent-v4/rkmesh_concurrent.ko /work/out/guest/root/rkmesh_concurrent.ko
            cd /work/out/guest/root
            find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /work/out/guest/initramfs.cpio.gz
            /work/out/runtime/lib64/ld-linux-x86-64.so.2 --library-path /work/out/runtime/lib/x86_64-linux-gnu:/work/out/runtime/usr/lib/x86_64-linux-gnu /work/out/runtime/bin/qemu-system-aarch64 --version > /work/out/QEMU_VERSION.txt
            printf "%s\n" "$ver" > /work/out/KERNEL_VERSION.txt
          '
          cp experiments/rk3588-concurrent-v4/ivshmem_server.py out/
          cp experiments/rk3588-concurrent-v4/run-four-v4.sh out/
          cp experiments/rk3588-concurrent-v4/rkmesh_concurrent.c out/
          cp experiments/rk3588-concurrent-v4/init.c out/init-source.c
          chmod +x out/ivshmem_server.py out/run-four-v4.sh
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Run strict four-guest concurrent-slot proof
        shell: bash
        run: |
          set -euo pipefail
          ./out/run-four-v4.sh

      - name: Package passing runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf rk3588-concurrent-slots-v4.tar.gz .
          sha256sum rk3588-concurrent-slots-v4.tar.gz | tee rk3588-concurrent-slots-v4.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-concurrent-slots-v4
          path: |
            rk3588-concurrent-slots-v4.tar.gz
            rk3588-concurrent-slots-v4.tar.gz.sha256
            out/QEMU_VERSION.txt
            out/KERNEL_VERSION.txt
            out/SHA256SUMS
            out/run/RESULT.txt
            out/run/server.log
            out/run/node*.log
            experiments/rk3588-concurrent-v4/**
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
