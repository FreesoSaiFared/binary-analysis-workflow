name: Prove RK3588 ARM QEMU ivshmem MSI-X with bus mastering v16
on:
  push:
    paths:
      - .github/workflows/stage-rk3588-qemu-msix-v4-retry16.yml
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Execute stable v4 generator with pci_set_master
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/stage-rk3588-qemu-msix-v4.yml').read_text().splitlines()
          start=next(i for i,l in enumerate(src) if l.strip()=='run: |')+1
          end=next(i for i in range(start,len(src)) if src[i].startswith('      - uses:'))
          lines=[l[10:] if l.startswith('          ') else l for l in src[start:end]]

          a=next(i for i,l in enumerate(lines) if 'cd /tmp;kp=$(apt-cache depends linux-image-arm64:arm64' in l)
          b=next(i for i,l in enumerate(lines[a:],a) if 'aarch64-linux-gnu-gcc -O2 -static -s /work/work/init.c' in l)
          replacement=[
              '  cd /tmp;kp=$(apt-cache depends linux-image-arm64:arm64|awk "/Depends: linux-image-[0-9]/{print \\$2;exit}");test -n "$kp";kb=${kp%%:*};ver=${kb#linux-image-};apt-get download "$kp";dpkg-deb -x "${kb}_"*"_arm64.deb" /tmp/kernel',
              '  hp="linux-headers-${ver}:arm64";apt-get download "$hp";hb=${hp%%:*}',
              '  common="linux-headers-${ver%-arm64}-common";kbuild="linux-kbuild-${ver%-arm64}";DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"',
              '  dpkg-deb -x "${hb}_"*"_arm64.deb" /',
              '  hdr="/usr/src/linux-headers-${ver}";test -d "$hdr";make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/work modules',
          ]
          lines[a:b]=replacement
          body='\n'.join(lines)+'\n'

          old='static struct pci_driver driver={.name="rkmesh_ivshmem",.id_table=ids,.probe=rkmesh_probe,.remove=rkmesh_remove};module_pci_driver(driver);'
          new='static struct pci_driver rkmesh_pci_driver={.name="rkmesh_ivshmem",.id_table=ids,.probe=rkmesh_probe,.remove=rkmesh_remove};module_pci_driver(rkmesh_pci_driver);'
          if old not in body: raise SystemExit('pci_driver declaration missing')
          body=body.replace(old,new)

          oldbm='rc=pcim_enable_device(pdev);if(rc)return rc;rc=pcim_iomap_regions(pdev,BIT(0)|BIT(2),"rkmesh_ivshmem");if(rc)return rc;'
          newbm='rc=pcim_enable_device(pdev);if(rc)return rc;pci_set_master(pdev);rc=pcim_iomap_regions(pdev,BIT(0)|BIT(2),"rkmesh_ivshmem");if(rc)return rc;'
          if oldbm not in body: raise SystemExit('pcim_enable_device anchor missing')
          body=body.replace(oldbm,newbm)

          olddev='-device ivshmem-doorbell,vectors=1,chardev=iv$n'
          newdev='-device ivshmem-doorbell,vectors=1,ioeventfd=off,chardev=iv$n'
          if olddev not in body: raise SystemExit('ivshmem device argument missing')
          body=body.replace(olddev,newdev)

          oldassert='rc=0;for x in "${p[@]}";do wait "$x"||rc=1;done;grep -q \'IVSHMEM_ALL_PEERS count=4\' "$R/server.log";'
          newassert='rc=0;for x in "${p[@]}";do wait "$x"||rc=1;done;echo ===SERVER===;cat "$R/server.log";for f in "$R"/node*.log;do echo "===${f##*/}===";grep "RKMESH_" "$f" || true;done;grep -q \'IVSHMEM_ALL_PEERS count=4\' "$R/server.log";'
          if oldassert not in body: raise SystemExit('runtime assertion prefix missing')
          body=body.replace(oldassert,newassert)

          Path('/tmp/stage.sh').write_text(body)
          PY
          bash /tmp/stage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-qemu-arm64-msix-v16
          path: |
            rk3588-qemu-arm64-msix-v4.tar.gz
            rk3588-qemu-arm64-msix-v4.tar.gz.sha256
            out/run/server.log
            out/run/node*.log
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
