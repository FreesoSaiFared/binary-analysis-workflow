name: Complete Agent Cloud offline Maven capsule

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-agent-cloud-offline-complete.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yangpeng366/agent-cloud-harness
          ref: b8c7cae6388e03e68910d4259377ce74f346831f
          path: src
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build online once, prove offline replay, package exact cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out work/m2repo
          actual=$(git -C src rev-parse HEAD)
          test "$actual" = b8c7cae6388e03e68910d4259377ce74f346831f
          test "$(git -C src rev-parse HEAD^{tree})" = a39848fe5ba3e75ca2f31cb100b05eb68fea62ad
          test "$(sha256sum src/pom.xml | cut -d' ' -f1)" = 6f37d4425e293394b89f8161190e34569be6eba55707fb097d4c9220512b4ab3
          repo="$PWD/work/m2repo"
          (cd src && mvn -B -Dmaven.repo.local="$repo" test package) | tee out/MAVEN_ONLINE_BUILD.log
          rm -rf src/target
          (cd src && mvn -B -o -Dmaven.repo.local="$repo" test package) | tee out/MAVEN_OFFLINE_REPLAY.log
          cp src/target/*-all.jar out/ 2>/dev/null || cp src/target/*.jar out/
          tar --exclude='.git' -C src -czf out/agent-cloud-exact-source.tar.gz .
          tar -C work -czf out/agent-cloud-m2repo.tar.gz m2repo
          maven_home=$(mvn -version | awk -F': ' '/Maven home/{print $2; exit}')
          tar -C "$(dirname "$maven_home")" -czf out/maven-home.tar.gz "$(basename "$maven_home")"
          {
            echo "commit=$actual"
            echo "tree=$(git -C src rev-parse HEAD^{tree})"
            echo "main_java=$(find src/src/main/java -name '*.java' | wc -l)"
            echo "test_java=$(find src/src/test/java -name '*.java' | wc -l)"
          } > out/IDENTITY.txt
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: vm-agent-cloud-maven-offline-complete
          path: out/
          retention-days: 1
          compression-level: 0
