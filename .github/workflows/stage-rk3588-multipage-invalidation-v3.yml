name: Prove RK3588 multi-page invalidation v3

on:
  push:
    paths:
      - 'experiments/rk3588-multipage-v3-src.tar.gz'
      - '.github/workflows/stage-rk3588-multipage-invalidation-v3.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify and extract v3 source
        shell: bash
        run: |
          set -euo pipefail
          echo '9975ce1f033eb2edc8ed2d7a4f43a922ad8c248da675b7732f1b2b146750c893  experiments/rk3588-multipage-v3-src.tar.gz' | sha256sum -c -
          rm -rf experiments/rk3588-multipage-v3
          mkdir -p experiments/rk3588-multipage-v3 /tmp/v3src
          tar -xzf experiments/rk3588-multipage-v3-src.tar.gz -C /tmp/v3src
          cp -a /tmp/v3src/rk3588-multipage-v3-src/. experiments/rk3588-multipage-v3/
          gcc -fsyntax-only -Wall -Wextra -Werror -pthread experiments/rk3588-multipage-v3/init.c
          python3 -m py_compile experiments/rk3588-multipage-v3/ivshmem_server.py
          bash -n experiments/rk3588-multipage-v3/run-four-v3.sh

      - name: Cross-build ARM64 guest, module, and portable QEMU runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" debian:trixie bash -lc '
            set -euo pipefail
            dpkg --add-architecture arm64
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
              cpio ca-certificates xz-utils make file
            cd /tmp
            kp=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-[0-9]/{print \$2;exit}")
            test -n "$kp"; kb=${kp%%:*}; ver=${kb#linux-image-}; apt-get download "$kp"
            kdeb=$(find /tmp -maxdepth 1 -name "${kb}_*_arm64.deb" | head -1); test -n "$kdeb"; dpkg-deb -x "$kdeb" /tmp/kernel
            hp="linux-headers-${ver}:arm64"; apt-get download "$hp"; hb=${hp%%:*}; hdeb=$(find /tmp -maxdepth 1 -name "${hb}_*_arm64.deb" | head -1); test -n "$hdeb"
            common="linux-headers-${ver%-arm64}-common"; kbuild="linux-kbuild-${ver%-arm64}"; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"; dpkg-deb -x "$hdeb" /
            hdr="/usr/src/linux-headers-${ver}"; test -d "$hdr"
            make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/experiments/rk3588-multipage-v3 modules
            aarch64-linux-gnu-gcc -O2 -static -s -Wall -Wextra -Werror -pthread /work/experiments/rk3588-multipage-v3/init.c -o /work/out/init
            mkdir -p /work/out/runtime/bin /work/out/runtime/lib /work/out/runtime/lib64
            cp /usr/bin/qemu-system-aarch64 /work/out/runtime/bin/
            ldd /usr/bin/qemu-system-aarch64 | awk "{for(i=1;i<=NF;i++)if(\$i~/^\//)print \$i}" | sort -u >/tmp/libs
            while read -r lib; do mkdir -p "/work/out/runtime$(dirname "$lib")"; cp -L "$lib" "/work/out/runtime$lib"; done </tmp/libs
            loader=$(ldd /usr/bin/qemu-system-aarch64 | awk "/ld-linux/{for(i=1;i<=NF;i++)if(\$i~/^\//){print \$i;exit}}")
            test -n "$loader"; mkdir -p "/work/out/runtime$(dirname "$loader")"; cp -L "$loader" "/work/out/runtime$loader"
            mkdir -p /work/out/guest/root/{proc,sys,dev}
            kernel=$(find /tmp/kernel/boot -maxdepth 1 -name "vmlinuz-*" | head -1); test -n "$kernel"; cp "$kernel" /work/out/guest/Image
            cp /work/out/init /work/out/guest/root/init; cp /work/experiments/rk3588-multipage-v3/rkmesh_pages.ko /work/out/guest/root/rkmesh_pages.ko
            cd /work/out/guest/root; find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /work/out/guest/initramfs.cpio.gz
            /work/out/runtime/lib64/ld-linux-x86-64.so.2 --library-path /work/out/runtime/lib/x86_64-linux-gnu:/work/out/runtime/usr/lib/x86_64-linux-gnu /work/out/runtime/bin/qemu-system-aarch64 --version > /work/out/QEMU_VERSION.txt
            printf "%s\n" "$ver" > /work/out/KERNEL_VERSION.txt
          '
          cp experiments/rk3588-multipage-v3/ivshmem_server.py out/
          cp experiments/rk3588-multipage-v3/run-four-v3.sh out/
          cp experiments/rk3588-multipage-v3/rkmesh_pages.c out/
          cp experiments/rk3588-multipage-v3/init.c out/init-source.c
          chmod +x out/ivshmem_server.py out/run-four-v3.sh
          (cd out && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Run strict four-guest multi-page invalidation proof
        shell: bash
        run: |
          set -euo pipefail
          ./out/run-four-v3.sh

      - name: Package passing runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf rk3588-multipage-invalidation-v3.tar.gz .
          sha256sum rk3588-multipage-invalidation-v3.tar.gz | tee rk3588-multipage-invalidation-v3.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-multipage-invalidation-v3
          path: |
            rk3588-multipage-invalidation-v3.tar.gz
            rk3588-multipage-invalidation-v3.tar.gz.sha256
            out/QEMU_VERSION.txt
            out/KERNEL_VERSION.txt
            out/SHA256SUMS
            out/run/RESULT.txt
            out/run/server.log
            out/run/node*.log
            experiments/rk3588-multipage-v3/**
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
