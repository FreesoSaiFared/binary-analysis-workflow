name: Stage Octopus runtime offline capsule

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-octopus-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  octopus-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Fetch exact source through gh-proxy
        env:
          COMMIT: 5f6d36ce3f21ea8e3e592fed9022c1b1970075a1
          EXPECTED_ARCHIVE_SHA: 32dc2f6aa0e62515e4a7fcd25ddae357196fa2df751e1e6c412ff676bbba6a80
        run: |
          set -euo pipefail
          mkdir -p work out
          url="https://gh-proxy.com/https://github.com/silentnoisehun/octopus-rust-runtime/archive/${COMMIT}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 -o work/source.tar.gz "$url"
          test "$(sha256sum work/source.tar.gz | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA"
          tar -tzf work/source.tar.gz >/dev/null
          tar -xzf work/source.tar.gz -C work
      - name: Vendor, test and build
        run: |
          set -euo pipefail
          src=$(find work -mindepth 1 -maxdepth 1 -type d -name 'octopus-rust-runtime-*' -print -quit)
          rustc --version | tee out/RUSTC_VERSION.txt
          cargo --version | tee out/CARGO_VERSION.txt
          cd "$src"
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          CARGO_BUILD_JOBS=2 cargo test --locked
          CARGO_BUILD_JOBS=2 cargo build --locked --release
          cp target/release/octopus-runtime "$OLDPWD/../out/octopus-runtime-linux-amd64"
          tar -czf "$OLDPWD/../out/octopus-cargo-vendor.tar.gz" vendor .cargo Cargo.lock Cargo.toml
          cd "$OLDPWD/.."
          sha256sum out/* | tee out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-octopus-rust-offline
          path: out/
          retention-days: 1
          compression-level: 0
