name: Prove RK3588 repeated-task hysteresis v8

on:
  push:
    branches:
      - rk3588-v8-hysteresis
    paths:
      - 'experiments/rk3588-hysteresis-v8/**'
      - '.github/workflows/stage-rk3588-hysteresis-v8.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate and verify exact V8 source
        shell: bash
        run: |
          set -euo pipefail
          D=experiments/rk3588-hysteresis-v8
          sed -e 's/RKMESH_V7/RKMESH_V8/g' \
              -e 's/rkmesh_v7/rkmesh_v8/g' \
              -e 's/RKMesh v7/RKMesh v8/g' \
              -e 's/0x53594e37U/0x53594e38U/g' \
              -e 's/0x600df007U/0x600df008U/g' \
              experiments/rk3588-adaptive-v7/rkmesh_v7.c > "$D/rkmesh_v8.c"
          cat <<'EOF' | sha256sum -c -
          1af8e22565a02f3f69e6cfaac7f84a1c5a8ffd0e2a8027e19d5188d6c51b1dfe  experiments/rk3588-hysteresis-v8/rkmesh_v8.c
          be4292c97292e9c2ee4b287d57de6c89599c94bb360a0987e8e7c0ca636d3925  experiments/rk3588-hysteresis-v8/init.c
          f68f532bee0973c4e954cee125cecc15df2dc9c11a81a2d97f1c0c26bc15cbed  experiments/rk3588-hysteresis-v8/run-one-v8.sh
          bf0da297922cc1d5e84a2a21f61ecffad68137a984ce71ba15daa2c67cb4fdf0  experiments/rk3588-hysteresis-v8/run-v8-matrix.py
          02c1198103148bdc68c08df3651e16bd93a48290ec9e5cc79ca334dd6f2a0b49  experiments/rk3588-hysteresis-v8/verify-v8.py
          6b2cae7dfcedd3cdc0519741f0d88685ad04062c7294079373c186939e5b66e9  experiments/rk3588-hysteresis-v8/Makefile
          ad3ad9c74dede27b8df735217571c385eff36420f8420de9286a6006f568ee38  experiments/rk3588-hysteresis-v8/EXPECTED_TASK_CHECKSUM.txt
          c7aa2afe1bcbaed5e33dd11aa498553cb47f2417e5fda1f053c68f79bc6a0844  experiments/rk3588-adaptive-v7/ivshmem_server.py
          EOF
          gcc -O2 -Wall -Wextra -Werror -fsyntax-only "$D/init.c"
          python3 -m py_compile "$D/run-v8-matrix.py" "$D/verify-v8.py" experiments/rk3588-adaptive-v7/ivshmem_server.py
          bash -n "$D/run-one-v8.sh"

      - name: Cross-build ARM64 guest and portable runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          docker run --rm --privileged -v "$PWD:/work" debian:trixie bash -lc '
            set -euo pipefail
            dpkg --add-architecture arm64
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              qemu-system-arm gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
              cpio ca-certificates xz-utils make file
            cd /tmp
            kp=$(apt-cache depends linux-image-arm64:arm64 | awk "/Depends: linux-image-[0-9]/{print \$2;exit}")
            test -n "$kp"; kb=${kp%%:*}; ver=${kb#linux-image-}; apt-get download "$kp"
            kdeb=$(find /tmp -maxdepth 1 -name "${kb}_*_arm64.deb" | head -1); test -n "$kdeb"; dpkg-deb -x "$kdeb" /tmp/kernel
            hp="linux-headers-${ver}:arm64"; apt-get download "$hp"; hb=${hp%%:*}; hdeb=$(find /tmp -maxdepth 1 -name "${hb}_*_arm64.deb" | head -1); test -n "$hdeb"
            common="linux-headers-${ver%-arm64}-common"; kbuild="linux-kbuild-${ver%-arm64}"
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$common" "$kbuild"
            dpkg-deb -x "$hdeb" /
            hdr="/usr/src/linux-headers-${ver}"; test -d "$hdr"
            make -C "$hdr" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=/work/experiments/rk3588-hysteresis-v8 modules
            aarch64-linux-gnu-gcc -O2 -static -s -Wall -Wextra -Werror /work/experiments/rk3588-hysteresis-v8/init.c -o /work/out/init
            mkdir -p /work/out/runtime/bin /work/out/runtime/lib /work/out/runtime/lib64
            cp /usr/bin/qemu-system-aarch64 /work/out/runtime/bin/
            ldd /usr/bin/qemu-system-aarch64 | awk "{for(i=1;i<=NF;i++)if(\$i~/^\//)print \$i}" | sort -u >/tmp/libs
            while read -r lib; do mkdir -p "/work/out/runtime$(dirname "$lib")"; cp -L "$lib" "/work/out/runtime$lib"; done </tmp/libs
            loader=$(ldd /usr/bin/qemu-system-aarch64 | awk "/ld-linux/{for(i=1;i<=NF;i++)if(\$i~/^\//){print \$i;exit}}")
            test -n "$loader"; mkdir -p "/work/out/runtime$(dirname "$loader")"; cp -L "$loader" "/work/out/runtime$loader"
            mkdir -p /work/out/guest/root/{proc,sys,dev}
            kernel=$(find /tmp/kernel/boot -maxdepth 1 -name "vmlinuz-*" | head -1); test -n "$kernel"; cp "$kernel" /work/out/guest/Image
            cp /work/out/init /work/out/guest/root/init
            cp /work/experiments/rk3588-hysteresis-v8/rkmesh_v8.ko /work/out/guest/root/rkmesh_v8.ko
            cd /work/out/guest/root
            find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > /work/out/guest/initramfs.cpio.gz
            /work/out/runtime/lib64/ld-linux-x86-64.so.2 --library-path /work/out/runtime/lib/x86_64-linux-gnu:/work/out/runtime/usr/lib/x86_64-linux-gnu /work/out/runtime/bin/qemu-system-aarch64 --version > /work/out/QEMU_VERSION.txt
            printf "%s\n" "$ver" > /work/out/KERNEL_VERSION.txt
          '
          cp experiments/rk3588-adaptive-v7/ivshmem_server.py out/
          cp experiments/rk3588-hysteresis-v8/run-one-v8.sh out/
          cp experiments/rk3588-hysteresis-v8/run-v8-matrix.py out/
          cp experiments/rk3588-hysteresis-v8/verify-v8.py out/
          cp experiments/rk3588-hysteresis-v8/EXPECTED_TASK_CHECKSUM.txt out/
          cp experiments/rk3588-hysteresis-v8/rkmesh_v8.c out/rkmesh_v8-source.c
          cp experiments/rk3588-hysteresis-v8/init.c out/init-source.c
          chmod +x out/ivshmem_server.py out/run-one-v8.sh out/run-v8-matrix.py out/verify-v8.py

      - name: Run four fresh four-guest repeated-task policy experiments
        shell: bash
        run: |
          set -euo pipefail
          ./out/run-v8-matrix.py
          ./out/verify-v8.py | tee out/V8_VERIFY.txt
          find out/results -type f -name iv.bin -delete
          find out/results -type s -delete || true
          (cd out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Package passing V8 runtime
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar -C out -czf rk3588-hysteresis-v8.tar.gz .
          sha256sum rk3588-hysteresis-v8.tar.gz | tee rk3588-hysteresis-v8.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rk3588-hysteresis-v8
          path: |
            rk3588-hysteresis-v8.tar.gz
            rk3588-hysteresis-v8.tar.gz.sha256
            out/QEMU_VERSION.txt
            out/KERNEL_VERSION.txt
            out/SHA256SUMS
            out/V8_RESULT.json
            out/V8_VERIFY.txt
            out/results/**
            experiments/rk3588-hysteresis-v8/**
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
