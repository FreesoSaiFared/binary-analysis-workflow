name: RV1126 F3 native-60 quality discriminator

on:
  push:
    branches:
      - rv1126-generative-video-f0-f1
    paths:
      - '.github/workflows/stage-rv1126-f3-native60-quality.yml'
      - 'experiments/rv1126-generative-video-fabric/run_f3_native60_quality_baseline.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native60-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install benchmark FFmpeg
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record benchmark environment
        shell: bash
        run: |
          set -euxo pipefail
          O="$RUNNER_TEMP/rv1126-f3-native60"
          mkdir -p "$O/evidence" "$O/work"
          cat /etc/os-release > "$O/evidence/os-release.txt"
          uname -a > "$O/evidence/uname.txt"
          python3 --version > "$O/evidence/python-version.txt" 2>&1
          ffmpeg -version > "$O/evidence/ffmpeg-version.txt" 2>&1
          ffprobe -version > "$O/evidence/ffprobe-version.txt" 2>&1
          sha256sum experiments/rv1126-generative-video-fabric/run_f3_native60_quality_baseline.py > "$O/evidence/harness-sha256.txt"

      - name: Fetch and verify native-60 open source
        shell: bash
        run: |
          set -euxo pipefail
          O="$RUNNER_TEMP/rv1126-f3-native60"
          SRC="$O/work/FFF-Sprueche_in_Hof_20191129_UHD-I_60_FPS.webm"
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/FFF-Spr%C3%BCche_in_Hof_20191129_%28UHD-I%2C_60_FPS%29.webm'
          printf '%s\n' "$URL" > "$O/evidence/source-url.txt"
          printf '%s\n' 'Wikimedia Commons; self-published Samsung Galaxy S10 footage; CC BY-SA 4.0; source page reports 3840x2160, 39.007 s, 60 FPS, 479019896 bytes, SHA-1 6166db6c22a19da63816cd5e65dbcd56e2a3e6fb.' > "$O/evidence/source-provenance.txt"
          curl -fL --retry 5 --retry-delay 3 -o "$SRC" "$URL"
          test "$(stat -c%s "$SRC")" -eq 479019896
          echo '6166db6c22a19da63816cd5e65dbcd56e2a3e6fb  '"$SRC" | sha1sum -c -
          stat -c 'SOURCE_SIZE_BYTES=%s' "$SRC" | tee "$O/evidence/source-size.txt"
          sha1sum "$SRC" | tee "$O/evidence/source-sha1.txt"
          sha256sum "$SRC" | tee "$O/evidence/source-sha256.txt"
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_read_frames \
            -show_entries format=duration,size,format_name -of json "$SRC" | tee "$O/evidence/source-native60-probe.json"

      - name: Execute native-60 180-frame seven-case matrix
        shell: bash
        run: |
          set -euxo pipefail
          O="$RUNNER_TEMP/rv1126-f3-native60"
          SRC="$O/work/FFF-Sprueche_in_Hof_20191129_UHD-I_60_FPS.webm"
          python3 experiments/rv1126-generative-video-fabric/run_f3_native60_quality_baseline.py \
            --source "$SRC" --out "$O/work/results" --start 10 --duration 3 \
            --license 'CC BY-SA 4.0; self-published Wikimedia Commons footage' \
            2>&1 | tee "$O/evidence/benchmark-command.log"
          grep -F 'NATIVE60_SOURCE_CONTRACT_PASS' "$O/evidence/benchmark-command.log"
          grep -F 'RV1126_F3_NATIVE60_QUALITY_BASELINE_PASS cases=7' "$O/evidence/benchmark-command.log"
          cp "$O/work/results/F3_NATIVE60_QUALITY_BASELINE.json" "$O/evidence/"
          cp "$O/work/results/F3_NATIVE60_QUALITY_BASELINE.csv" "$O/evidence/"

      - name: Verify exact candidate frame counts and analyze ranking
        shell: bash
        run: |
          set -euxo pipefail
          O="$RUNNER_TEMP/rv1126-f3-native60"
          python3 - <<'PY' "$O/work/results" "$O/evidence/F3_NATIVE60_QUALITY_BASELINE.json" "$O/evidence/F3_NATIVE60_QUALITY_ANALYSIS.json" "$O/evidence/frame-count-verification.json"
          import json, pathlib, subprocess, sys
          root=pathlib.Path(sys.argv[1]); source_json=pathlib.Path(sys.argv[2]); analysis_out=pathlib.Path(sys.argv[3]); frame_out=pathlib.Path(sys.argv[4])
          expected=[
            'reference_native60_1080p.mkv','spatial_360p60_to_1080p60.mkv',
            'hold_360p5_to_1080p60.mkv','linear_360p5_to_1080p60.mkv',
            'hold_360p10_to_1080p60.mkv','linear_360p10_to_1080p60.mkv',
            'hold_360p15_to_1080p60.mkv','linear_360p15_to_1080p60.mkv']
          checks=[]
          for name in expected:
              p=root/name
              cp=subprocess.run(['ffprobe','-v','error','-count_frames','-select_streams','v:0',
                                 '-show_entries','stream=width,height,r_frame_rate,nb_read_frames','-of','json',str(p)],
                                check=True,text=True,capture_output=True)
              s=json.loads(cp.stdout)['streams'][0]
              row={'file':name,'width':int(s['width']),'height':int(s['height']),
                   'r_frame_rate':s['r_frame_rate'],'decoded_frames':int(s['nb_read_frames'])}
              assert row['width']==1920 and row['height']==1080, row
              assert row['decoded_frames']==180, row
              checks.append(row)
          frame_out.write_text(json.dumps({'protocol':'RV1126_F3_NATIVE60_FRAME_COUNT/1','results':checks},indent=2,sort_keys=True)+'\n')
          src=json.loads(source_json.read_text()); rows=src['results']; by={r['case']:r for r in rows}; spatial=by['spatial_only_360p60']
          expected_cases={'spatial_only_360p60','hold_5_to_60','linear_5_to_60','hold_10_to_60','linear_10_to_60','hold_15_to_60','linear_15_to_60'}
          assert set(by)==expected_cases
          comparisons=[]
          for fps in (5,10,15):
              h=by[f'hold_{fps}_to_60']; l=by[f'linear_{fps}_to_60']
              comparisons.append({
                'authoritative_fps':fps,
                'linear_minus_hold_psnr_db':l['psnr_db']-h['psnr_db'],
                'linear_minus_hold_ssim':l['ssim']-h['ssim'],
                'hold_gap_to_spatial_psnr_db':h['psnr_db']-spatial['psnr_db'],
                'hold_gap_to_spatial_ssim':h['ssim']-spatial['ssim'],
                'linear_gap_to_spatial_psnr_db':l['psnr_db']-spatial['psnr_db'],
                'linear_gap_to_spatial_ssim':l['ssim']-spatial['ssim']})
          payload={
            'protocol':'RV1126_F3_NATIVE60_QUALITY_ANALYSIS/1',
            'scope':'native-60 host-side FFmpeg baseline comparison only; no trained-neural quality and no RV1126 timing claim',
            'ranking_by_psnr':[r['case'] for r in sorted(rows,key=lambda r:r['psnr_db'],reverse=True)],
            'ranking_by_ssim':[r['case'] for r in sorted(rows,key=lambda r:r['ssim'],reverse=True)],
            'linear_vs_hold_and_spatial_deltas':comparisons,
            'daybreak_comparison_question':'Does native-60 footage preserve or reverse the prior ~30->60-normalized Daybreak hold-over-linear ordering?'
          }
          analysis_out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print('RV1126_F3_NATIVE60_FRAME_COUNT_PASS files=8 frames_each=180')
          print(json.dumps(payload,sort_keys=True))
          PY

      - name: Hash compact benchmark evidence
        shell: bash
        run: |
          set -euxo pipefail
          O="$RUNNER_TEMP/rv1126-f3-native60"
          find "$O/evidence" -type f -print0 | sort -z | xargs -0 sha256sum | tee "$O/evidence/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv1126-f3-native60-quality-evidence
          path: ${{ runner.temp }}/rv1126-f3-native60/evidence/**
          if-no-files-found: error
