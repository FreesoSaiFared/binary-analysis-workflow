name: Stage pinned orchestration repositories

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-orchestration-repos.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: cee
            repository: p0nymc1/cee
            commit: 4c2141fddb96ebbc7a65d8d9f662522597a989ba
          - slug: octopus-rust-runtime
            repository: silentnoisehun/octopus-rust-runtime
            commit: 5f6d36ce3f21ea8e3e592fed9022c1b1970075a1
          - slug: agent-cloud-harness
            repository: yangpeng366/agent-cloud-harness
            commit: b8c7cae6388e03e68910d4259377ce74f346831f
          - slug: gridbash
            repository: jasonsuhari/gridbash
            commit: 6cb6982a7414c6283cacf243465134271af81607
          - slug: autonomous-grid
            repository: autonomous-ai/autonomous-grid
            commit: 62f8671e7dd1413f4574395359a60d1bfbe53da9
    steps:
      - name: Retrieve pinned source through gh-proxy
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          REPOSITORY: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
        run: |
          set -euo pipefail
          mkdir -p "stage/${SLUG}"
          archive="stage/${SLUG}/${SLUG}-${COMMIT}.tar.gz"
          source_url="https://github.com/${REPOSITORY}/archive/${COMMIT}.tar.gz"
          proxy_url="https://gh-proxy.com/${source_url}"
          echo "source_url=${source_url}"
          echo "proxy_url=${proxy_url}"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1200 \
            --output "${archive}.part" "${proxy_url}"
          mv "${archive}.part" "${archive}"
          tar -tzf "${archive}" >/dev/null
          sha256sum "${archive}" | tee "stage/${SLUG}/SHA256SUMS"
          bytes=$(stat -c '%s' "${archive}")
          cat >"stage/${SLUG}/SOURCE.json" <<EOF
          {
            "repository": "${REPOSITORY}",
            "commit": "${COMMIT}",
            "source_url": "${source_url}",
            "proxy_url": "${proxy_url}",
            "archive": "$(basename "${archive}")",
            "bytes": ${bytes}
          }
          EOF
          printf '%s\t%s\t%s\t%s\n' "${REPOSITORY}" "${COMMIT}" "${bytes}" "$(cut -d' ' -f1 stage/${SLUG}/SHA256SUMS)" \
            >"stage/${SLUG}/SOURCE.tsv"
          du -h "${archive}"
          tar -tzf "${archive}" | sed -n '1,40p'

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: src-${{ matrix.slug }}-${{ matrix.commit }}
          path: stage/${{ matrix.slug }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
